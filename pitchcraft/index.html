<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#06090f" />
    <title>Pitchcraft</title>
    <meta name="description" content="Pitchcraft — an original browser-based 3D football match simulator." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%23f6f6f2'/><circle cx='16' cy='16' r='4' fill='%231c1c22'/></svg>" />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>

    <div id="rotate">
      <div>
        <div class="phone"></div>
        <p>Rotate to landscape</p>
      </div>
    </div>

    <div id="loading">
      <div class="boot">
        <div class="mark">
          <span class="ball"></span>
          <h1>PITCHCRAFT</h1>
        </div>
        <p>Building the stadium…</p>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
